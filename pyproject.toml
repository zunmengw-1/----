[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-tcn"
version = "0.1.0"
description = "Minute-level A-share return modeling and cost-aware evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "pyarrow>=15",
    "torch>=2.3,<3",
]

[project.scripts]
intraday-tcn = "intraday_tcn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["intraday_tcn*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C901", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts"]
