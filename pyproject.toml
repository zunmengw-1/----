[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intraday-tcn"
version = "0.1.0"
description = "Minute-level A-share return modeling and cost-aware evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.12,<2",
    "pyarrow>=15",
    "torch>=2.3,<3",
]

[project.scripts]
intraday-tcn = "intraday_tcn.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
